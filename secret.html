<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="content-container">
        <p>Loading...</p>
    </div>

    <script>
        // Initialize Supabase client
         const SUPABASE_URL = 'https://oyaumovuijcflmtakyea.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95YXVtb3Z1aWpjZmxtdGFreWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NDU0ODcsImV4cCI6MjA4NjAyMTQ4N30.U0jydo3wasXUbohcQy6yyrskxLSm2sIEtzcJq382fUE'
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkAuthAndLoadContent() {
            const contentDiv = document.getElementById('content-container');

            // Check if user is authenticated
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();

            if (!session) {
                // Not logged in - redirect to login page
                window.location.href = 'login.html';
                return;
            }

            // Check if this is first login
            const user = session.user;
            if (user.user_metadata?.first_login === true) {
                // Show password change form
                contentDiv.innerHTML = `
                    <h2>Welcome! Please set your new password</h2>
                    <form id="password-change-form">
                        <input type="password" id="new-password" placeholder="New password" required>
                        <button type="submit">Set Password</button>
                    </form>
                `;

                document.getElementById('password-change-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const newPassword = document.getElementById('new-password').value;

                    // Update password
                    const { error: updateError } = await supabase.auth.updateUser({
                        password: newPassword,
                        data: { first_login: false }
                    });

                    if (updateError) {
                        alert('Error updating password: ' + updateError.message);
                    } else {
                        alert('Password updated! Reloading page...');
                        location.reload();
                    }
                });
                return;
            }

            // User is authenticated and not first login - fetch secret content
            console.log('Fetching content from Supabase...');
            const { data, error } = await supabase
                .from('secret_content')
                .select('content')
                .single();

            console.log('Supabase returned:', data);
            console.log('Any errors?', error);

            if (error) {
                contentDiv.innerHTML = `<p>Error loading content: ${error.message}</p>`;
            } else {
                contentDiv.innerHTML = data.content;
            }
        }

        // Run on page load
        checkAuthAndLoadContent();
    </script>
</body>
</html>
